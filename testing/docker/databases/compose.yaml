name: sqlstudio-databases

services:
  mysql-8-0:
    image: mysql:8.0
    container_name: sqlstudio-mysql-8-0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sqlstudio}
      MYSQL_USER: ${MYSQL_USER:-sqlstudio}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sqlstudio}
    ports:
      - "127.0.0.1:${MYSQL_80_PORT:-33080}:3306"
    volumes:
      - mysql_80_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - databases

  mysql-8-2:
    image: mysql:8.2
    container_name: sqlstudio-mysql-8-2
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sqlstudio}
      MYSQL_USER: ${MYSQL_USER:-sqlstudio}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sqlstudio}
    ports:
      - "127.0.0.1:${MYSQL_82_PORT:-33082}:3306"
    volumes:
      - mysql_82_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - databases

  mysql-latest:
    image: mysql:latest
    container_name: sqlstudio-mysql-latest
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sqlstudio}
      MYSQL_USER: ${MYSQL_USER:-sqlstudio}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sqlstudio}
    ports:
      - "127.0.0.1:${MYSQL_LATEST_PORT:-33060}:3306"
    volumes:
      - mysql_latest_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - databases

  mariadb-10-11:
    image: mariadb:10.11
    container_name: sqlstudio-mariadb-10-11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-sqlstudio}
      MARIADB_USER: ${MARIADB_USER:-sqlstudio}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-sqlstudio}
    ports:
      - "127.0.0.1:${MARIADB_1011_PORT:-33011}:3306"
    volumes:
      - mariadb_1011_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - databases

  mariadb-latest:
    image: mariadb:latest
    container_name: sqlstudio-mariadb-latest
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-sqlstudio}
      MARIADB_USER: ${MARIADB_USER:-sqlstudio}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-sqlstudio}
    ports:
      - "127.0.0.1:${MARIADB_LATEST_PORT:-33070}:3306"
    volumes:
      - mariadb_latest_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - databases

  questdb:
    image: questdb/questdb:latest
    container_name: sqlstudio-questdb
    restart: unless-stopped
    environment:
      QDB_PG_USER: ${QUESTDB_USER:-sqlstudio}
      QDB_PG_PASSWORD: ${QUESTDB_PASSWORD:-sqlstudio}
      QDB_HTTP_USER: ${QUESTDB_USER:-sqlstudio}
      QDB_HTTP_PASSWORD: ${QUESTDB_PASSWORD:-sqlstudio}
    ports:
      - "127.0.0.1:${QUESTDB_HTTP_PORT:-9000}:9000"
      - "127.0.0.1:${QUESTDB_PG_PORT:-8812}:8812"
    volumes:
      - questdb_data:/var/lib/questdb
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error --user \"$${QDB_HTTP_USER}:$${QDB_HTTP_PASSWORD}\" http://127.0.0.1:9003/status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - databases

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: sqlstudio-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-sqlstudio}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-sqlstudio}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-sqlstudio}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-18123}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-19000}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - databases

  influxdb:
    image: influxdb:2
    container_name: sqlstudio-influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USER:-sqlstudio}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:-sqlstudio}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-sqlstudio}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-sqlstudio}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN:-sqlstudio-dev-token}
    ports:
      - "127.0.0.1:${INFLUXDB_HTTP_PORT:-8086}:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://127.0.0.1:8086"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - databases

  timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: sqlstudio-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TIMESCALEDB_DATABASE:-sqlstudio}
      POSTGRES_USER: ${TIMESCALEDB_USER:-sqlstudio}
      POSTGRES_PASSWORD: ${TIMESCALEDB_PASSWORD:-sqlstudio}
    ports:
      - "127.0.0.1:${TIMESCALEDB_PORT:-5433}:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --host=127.0.0.1 --username=\"$${POSTGRES_USER}\" --dbname=\"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - databases

volumes:
  mysql_80_data:
  mysql_82_data:
  mysql_latest_data:
  mariadb_1011_data:
  mariadb_latest_data:
  questdb_data:
  clickhouse_data:
  influxdb_data:
  influxdb_config:
  timescaledb_data:

networks:
  databases:
    name: sqlstudio-databases
